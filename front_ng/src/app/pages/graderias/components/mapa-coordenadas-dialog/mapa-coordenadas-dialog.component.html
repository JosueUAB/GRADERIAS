<p-dialog
    [(visible)]="visibleModel"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '94vw', maxWidth: '880px' }"
    [header]="'Geolocalización: ' + (nombreGraderia() || 'Gradería')"
    (onShow)="onDialogShow()"
    (onHide)="onDialogHide()"
    styleClass="p-dialog-mapa"
>
    <div class="flex flex-col gap-3">
        <!-- Subtítulo e instrucciones -->
        <div class="flex items-center gap-2 bg-surface-50 dark:bg-surface-800 p-2.5 rounded-2xl border border-surface-200 dark:border-surface-700 text-xs sm:text-sm text-surface-700 dark:text-surface-200">
            <i class="pi pi-map-marker text-primary text-base"></i>
            <span>Haz clic o arrastra el pin directamente sobre la ubicación de la gradería.</span>
        </div>

        <!-- Coordenadas seleccionadas y botón centrar -->
        <div class="flex items-center justify-between flex-wrap gap-2 px-1">
            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-surface-500">Coordenadas exactas:</span>
                <p-tag severity="info" [value]="'Lat: ' + latTemporal().toFixed(6)" />
                <p-tag severity="info" [value]="'Lng: ' + lngTemporal().toFixed(6)" />
            </div>

            <button
                type="button"
                pButton
                label="Centrar en Oruro"
                icon="pi pi-compass"
                class="p-button-text p-button-sm text-xs py-1 px-2"
                (click)="centrarEnOruro()"
                pTooltip="Mover vista al centro urbano de Oruro"
            ></button>
        </div>

        <!-- Contenedor del Mapa MapLibre -->
        <div class="relative w-full h-[400px] sm:h-[460px] rounded-2xl overflow-hidden border border-surface-200 dark:border-surface-700 shadow-inner">
            <div #mapPickerContainer class="w-full h-full" [ngClass]="{ 'map-dark-raster': layoutService.isDarkTheme() && fallbackRasterActivo() }"></div>

            <!-- Badge indicativo flotante -->
            <div class="absolute bottom-2 left-2 bg-surface-900/85 text-white text-[11px] px-2.5 py-1 rounded-lg backdrop-blur pointer-events-none flex items-center gap-1.5 z-10 border border-white/10">
                <i class="pi pi-map"></i>
                <span>MapLibre + OpenFreeMap</span>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <div class="flex items-center justify-between w-full pt-2">
            <button
                type="button"
                pButton
                label="Cancelar"
                icon="pi pi-times"
                class="p-button-text p-button-secondary"
                (click)="cerrar()"
            ></button>

            <button
                type="button"
                pButton
                label="Confirmar Ubicación"
                icon="pi pi-check"
                class="p-button-primary rounded-xl font-bold px-4"
                (click)="confirmar()"
            ></button>
        </div>
    </ng-template>
</p-dialog>
