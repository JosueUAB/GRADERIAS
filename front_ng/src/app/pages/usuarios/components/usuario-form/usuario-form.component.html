<p-dialog 
    [header]="modoEdicion ? 'Editar Usuario: ' + usuario?.username : 'Nuevo Usuario del Sistema'" 
    [(visible)]="visible" 
    [modal]="true" 
    [closable]="!cargando"
    [draggable]="false" 
    [resizable]="false" 
    [style]="{ width: '560px', maxWidth: '95vw' }"
    styleClass="rounded-3xl overflow-hidden shadow-2xl"
    (onHide)="cerrar()"
>
    <form [formGroup]="form" (ngSubmit)="enviarFormulario()" class="flex flex-col gap-4 pt-2">
        
        <!-- Nombre Completo -->
        <div class="flex flex-col gap-1.5">
            <label for="name" class="text-sm font-semibold text-surface-800 dark:text-surface-100 flex items-center justify-between">
                <span>Nombre Completo <span class="text-red-500">*</span></span>
                @if (form.get('name')?.touched && form.get('name')?.hasError('required')) {
                    <span class="text-xs text-red-500 font-normal">El nombre es requerido</span>
                }
            </label>
            <input 
                pInputText 
                id="name" 
                formControlName="name" 
                placeholder="Ej. Juan Pérez García" 
                class="rounded-xl w-full"
                [class.p-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
            />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Nombre de Usuario -->
            <div class="flex flex-col gap-1.5">
                <label for="username" class="text-sm font-semibold text-surface-800 dark:text-surface-100 flex items-center justify-between">
                    <span>Usuario <span class="text-red-500">*</span></span>
                    @if (form.get('username')?.touched && form.get('username')?.hasError('required')) {
                        <span class="text-xs text-red-500 font-normal">Requerido</span>
                    }
                </label>
                <span class="p-input-icon-left w-full">
                    <input 
                        pInputText 
                        id="username" 
                        formControlName="username" 
                        placeholder="Ej. jperez" 
                        class="rounded-xl w-full font-mono text-sm"
                        [class.p-invalid]="form.get('username')?.invalid && form.get('username')?.touched"
                    />
                </span>
            </div>

            <!-- Rol del Sistema -->
            <div class="flex flex-col gap-1.5">
                <label for="role" class="text-sm font-semibold text-surface-800 dark:text-surface-100">
                    Rol Asignado <span class="text-red-500">*</span>
                </label>
                <p-select 
                    id="role"
                    formControlName="role" 
                    [options]="opcionesRoles" 
                    placeholder="Selecciona un rol" 
                    styleClass="w-full rounded-xl"
                />
            </div>
        </div>



        <!-- Contraseña Inicial (Solo en Modo Creación) -->
        @if (!modoEdicion) {
            <div class="flex flex-col gap-1.5">
                <label for="password" class="text-sm font-semibold text-surface-800 dark:text-surface-100 flex items-center justify-between">
                    <span>Contraseña Inicial <span class="text-red-500">*</span></span>
                    @if (form.get('password')?.touched && form.get('password')?.hasError('minlength')) {
                        <span class="text-xs text-red-500 font-normal">Mínimo 6 caracteres</span>
                    }
                </label>
                <p-password 
                    id="password" 
                    formControlName="password" 
                    [toggleMask]="true" 
                    [feedback]="false" 
                    [fluid]="true"
                    placeholder="Contraseña segura (mín. 6 caracteres)"
                    inputStyleClass="w-full rounded-xl text-sm"
                />
            </div>
        }

        <!-- Teléfonos de Contacto (Con filtro estricto numérico) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Teléfono 1 -->
            <div class="flex flex-col gap-1.5">
                <label for="tel1" class="text-sm font-semibold text-surface-800 dark:text-surface-100 flex items-center justify-between">
                    <span>Celular Contacto 1</span>
                    @if (form.get('telefono_contacto_1')?.touched && form.get('telefono_contacto_1')?.hasError('pattern')) {
                        <span class="text-xs text-red-500 font-normal">Solo números (7-15)</span>
                    }
                </label>
                <div class="relative">
                    <input 
                        pInputText 
                        id="tel1" 
                        formControlName="telefono_contacto_1" 
                        placeholder="Ej. 77712345" 
                        class="rounded-xl w-full font-mono text-sm"
                        (input)="filtrarSoloDigitos('telefono_contacto_1', $event)"
                        maxlength="15"
                    />
                </div>
            </div>

            <!-- Teléfono 2 -->
            <div class="flex flex-col gap-1.5">
                <label for="tel2" class="text-sm font-semibold text-surface-800 dark:text-surface-100 flex items-center justify-between">
                    <span>Celular Contacto 2</span>
                    @if (form.get('telefono_contacto_2')?.touched && form.get('telefono_contacto_2')?.hasError('pattern')) {
                        <span class="text-xs text-red-500 font-normal">Solo números (7-15)</span>
                    }
                </label>
                <div class="relative">
                    <input 
                        pInputText 
                        id="tel2" 
                        formControlName="telefono_contacto_2" 
                        placeholder="Ej. 78998765" 
                        class="rounded-xl w-full font-mono text-sm"
                        (input)="filtrarSoloDigitos('telefono_contacto_2', $event)"
                        maxlength="15"
                    />
                </div>
            </div>
        </div>

        <!-- Banner Informativo -->
        <div class="bg-surface-100 dark:bg-surface-800/80 p-3 rounded-2xl flex items-start gap-2.5 text-xs text-muted-color border border-surface-200 dark:border-surface-700">
            <i class="pi pi-shield text-primary text-base mt-0.5"></i>
            <div>
                <strong class="text-surface-800 dark:text-surface-200">Seguridad:</strong>
                {{ modoEdicion 
                    ? 'Los cambios en roles o contactos se reflejarán inmediatamente en las sesiones activas.' 
                    : 'Al crear el usuario se asignarán automáticamente los permisos básicos iniciales del sistema.' }}
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex items-center justify-end gap-2 pt-2 border-t border-surface-200 dark:border-surface-800 mt-2">
            <p-button 
                label="Cancelar" 
                icon="pi pi-times" 
                [rounded]="true" 
                [text]="true" 
                severity="secondary" 
                (click)="cerrar()"
                [disabled]="cargando"
            />
            <p-button 
                [label]="modoEdicion ? 'Actualizar Usuario' : 'Crear Usuario'" 
                [icon]="modoEdicion ? 'pi pi-check' : 'pi pi-user-plus'" 
                [rounded]="true" 
                type="submit" 
                [loading]="cargando"
                [disabled]="form.invalid || cargando"
                styleClass="shadow-md"
            />
        </div>
    </form>
</p-dialog>
