<p-dialog 
    [header]="'Restablecer Contraseña: ' + (usuario?.username || '')" 
    [(visible)]="visible" 
    [modal]="true" 
    [closable]="!cargando"
    [draggable]="false" 
    [resizable]="false" 
    [style]="{ width: '480px', maxWidth: '95vw' }"
    styleClass="rounded-3xl overflow-hidden shadow-2xl"
    (onHide)="cerrar()"
>
    <form [formGroup]="form" (ngSubmit)="enviarFormulario()" class="flex flex-col gap-4 pt-2">
        
        <!-- Alerta de Seguridad -->
        <div class="bg-amber-500/10 border border-amber-500/30 text-amber-700 dark:text-amber-300 p-3.5 rounded-2xl flex items-start gap-3 text-xs leading-relaxed">
            <i class="pi pi-exclamation-triangle text-lg mt-0.5 text-amber-500 shrink-0"></i>
            <div>
                <strong>Acción de Auditoría:</strong> Al guardar, la contraseña del usuario será actualizada y todas sus sesiones activas serán 
                <strong>revocadas de inmediato</strong> por seguridad.
            </div>
        </div>

        <!-- Usuario Objetivo -->
        <div class="bg-surface-100 dark:bg-surface-800 p-3 rounded-xl flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
                <i class="pi pi-user text-muted-color"></i>
                <span class="text-surface-700 dark:text-surface-200">Usuario: <strong>{{ usuario?.name }}</strong></span>
            </div>
            <span class="font-mono text-muted-color">&#64;{{ usuario?.username }}</span>
        </div>

        <!-- Nueva Contraseña -->
        <div class="flex flex-col gap-1.5">
            <label for="new_password" class="text-sm font-semibold text-surface-800 dark:text-surface-100 flex items-center justify-between">
                <span>Nueva Contraseña <span class="text-red-500">*</span></span>
                @if (form.get('password')?.touched && form.get('password')?.hasError('minlength')) {
                    <span class="text-xs text-red-500 font-normal">Mínimo 6 caracteres</span>
                }
            </label>
            <p-password 
                id="new_password" 
                formControlName="password" 
                [toggleMask]="true" 
                [feedback]="true" 
                [fluid]="true"
                placeholder="Ingresa la nueva contraseña"
                inputStyleClass="w-full rounded-xl text-sm"
            />
        </div>

        <!-- Confirmación de Contraseña -->
        <div class="flex flex-col gap-1.5">
            <label for="password_confirmation" class="text-sm font-semibold text-surface-800 dark:text-surface-100 flex items-center justify-between">
                <span>Confirmar Contraseña <span class="text-red-500">*</span></span>
                @if (form.touched && form.hasError('noCoincide')) {
                    <span class="text-xs text-red-500 font-normal">Las contraseñas no coinciden</span>
                }
            </label>
            <p-password 
                id="password_confirmation" 
                formControlName="password_confirmation" 
                [toggleMask]="true" 
                [feedback]="false" 
                [fluid]="true"
                placeholder="Repite la nueva contraseña"
                inputStyleClass="w-full rounded-xl text-sm"
            />
        </div>

        <!-- Motivo / Justificación (Opcional) -->
        <div class="flex flex-col gap-1.5">
            <label for="reason" class="text-sm font-semibold text-surface-800 dark:text-surface-100">
                <span>Motivo del Reseteo (Opcional)</span>
            </label>
            <input 
                pInputText 
                id="reason" 
                formControlName="reason" 
                placeholder="Ej. Solicitud directa del operador / olvido" 
                class="rounded-xl w-full text-sm"
            />
        </div>

        <!-- Botones de Acción -->
        <div class="flex items-center justify-end gap-2 pt-2 border-t border-surface-200 dark:border-surface-800 mt-2">
            <p-button 
                label="Cancelar" 
                icon="pi pi-times" 
                [rounded]="true" 
                [text]="true" 
                severity="secondary" 
                (click)="cerrar()"
                [disabled]="cargando"
            />
            <p-button 
                label="Restablecer Contraseña" 
                icon="pi pi-lock" 
                [rounded]="true" 
                severity="warn"
                type="submit" 
                [loading]="cargando"
                [disabled]="form.invalid || cargando"
                styleClass="shadow-md"
            />
        </div>
    </form>
</p-dialog>
