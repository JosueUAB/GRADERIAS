server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        text/javascript js mjs;
        application/wasm wasm;
    }

    # Compresión gzip para máxima velocidad
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml+rss application/atom+xml image/svg+xml;

    # No cachear index.html ni env.js para evitar que los usuarios queden con versiones viejas o variables desactualizadas
    location ~* (index\.html|assets/env\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Web Workers y módulos JavaScript (.mjs) con MIME type text/javascript estricto
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Content-Type text/javascript;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Cache estático para assets con hash (JS, CSS, imágenes, fuentes)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Soporte para Angular HTML5 PushState Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
